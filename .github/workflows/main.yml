name: Publish to CurseForge

# This triggers the workflow on every push to any branch
on:
  push:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Change to '21' if using the latest Minecraft versions
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Mod with Gradle
        run: ./gradlew build

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with: 
          # I grabbed your specific Project ID from your CurseForge tab!
          curseforge-id: '1443384' 
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
