name: Deploy to GCP & Access Firestore

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Required for Workload Identity Federation (OIDC) token exchange
permissions:
  id-token: write
  contents: read

jobs:
  firestore-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      # Step 2: Authenticate to Google Cloud via Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/952718172772/locations/global/workloadIdentityPools/project-null/providers/github'
          service_account: 'github@project-16634.iam.gserviceaccount.com'

      # Step 3: Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 4: Verify authentication context
      - name: Verify Authentication
        run: |
          gcloud auth list
          gcloud config get-value project

      # Step 5: (Optional) Set up Node.js for application script interacting with Firestore
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 6: Example step running your script/tests that interact with Firestore
      # Google SDK automatically detects Application Default Credentials exported by auth step
      - name: Install dependencies & run app
        run: |
          npm ci || true
          # node index.js
