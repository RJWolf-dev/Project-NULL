plugins {
	id 'fabric-loom' version '1.3.10'
	id 'maven-publish'
}

version = '1.0.0'

group = 'com.rjwebb134'

base {
	archivesName = 'aiterror'
}

loom {
	silentMojangWarning = true
	runs {
		client {
			client()
			setConfigName("fabric-client")
		}
		server {
			server()
			setConfigName("fabric-server")
		}
	}
}

repositories {
	mavenCentral()
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.google.com/" } // Google's Maven repository
}

dependencies {
	minecraft "com.mojang:minecraft:1.20.1"
	mappings "net.fabricmc:yarn:1.20.1+build.8:v2"
	modImplementation "net.fabricmc:fabric-loader:0.15.3"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.96.4+1.20.1"
	implementation "org.tensorflow:tensorflow-core-platform:1.2.0"
	testImplementation "org.junit.jupiter:junit-jupiter:5.9.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.3"
	implementation platform("com.google.cloud:libraries-bom:26.86.0")
	implementation("com.google.cloud:google-cloud-firestore")
	include("com.google.cloud:google-cloud-firestore")
	implementation("com.google.firebase:firebase-admin:9.10.0")
	include("com.google.firebase:firebase-admin:9.10.0")
}

test {
	useJUnitPlatform()
}

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java']
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.fork = true
	options.forkOptions.jvmArgs += '-XX:+IgnoreUnrecognizedVMOptions'
	options.forkOptions.jvmArgs += '-Dfile.encoding=UTF-8'
	options.forkOptions.jvmArgs += '-Xmx2G'
}
